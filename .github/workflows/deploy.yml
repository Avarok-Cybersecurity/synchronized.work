# Deploys the synchronized.work Worker on a push to main, and only then: a pull request never
# deploys (`xtask plan` fails this file if it gains a pull_request trigger). The PR-side proof
# is ci.yml's `wrangler deploy --dry-run` job.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time, and a newer main never cancels one that is mid-upload.
concurrency:
  group: deploy-synchronized-work
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # wrangler's anonymous usage metrics are a call to Cloudflare; CI makes none it does not need.
  WRANGLER_SEND_METRICS: false
  RUSTFLAGS: -D warnings
  WORKER_BUILD_VERSION: 0.8.7
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: cargo install --locked worker-build --version "$WORKER_BUILD_VERSION"
      - name: Plan gate (Paid features, deploy on main only)
        run: cargo run --locked -p xtask -- plan
      - run: cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
      - name: Build the site (the Worker's [assets])
        env:
          # Versions the service worker's cache, so this deploy replaces the old one.
          SITE_BUILD_SHA: ${{ github.sha }}
        run: npm ci --prefix site && npm run build --prefix site
      - name: Site size gate
        run: cargo run --locked -p xtask -- site-size site/dist
      - name: Build the bundle
        # getrandom's browser backend for the wasm build only (see ci.yml's worker job).
        env:
          RUSTFLAGS: -D warnings --cfg getrandom_backend="wasm_js"
        run: npx wrangler deploy --dry-run --outdir target/bundle
      - name: Size gate
        run: cargo run --locked -p xtask -- size target/bundle
      - name: Deploy
        env:
          RUSTFLAGS: -D warnings --cfg getrandom_backend="wasm_js"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var "SW_BUILD_SHA:${GITHUB_SHA}"
