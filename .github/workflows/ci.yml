# Every pull request and every push to main (design §11.1). Nothing here deploys: deploy.yml
# does, on main only; the `worker` job proves the deploy with `wrangler deploy --dry-run`. The toolchain, components and the wasm32 target come from rust-toolchain.toml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # wrangler's anonymous usage metrics are a call to Cloudflare; CI makes none it does not need.
  WRANGLER_SEND_METRICS: false
  RUSTFLAGS: -D warnings
  # The wasm test runner must match the wasm-bindgen pinned in Cargo.toml.
  WASM_BINDGEN_VERSION: 0.2.129
  PURE_CRATES: -p sw-model -p sw-protocol -p sw-crypto -p sw-client -p sw-graph -p sw-view -p sw-app-core

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy $PURE_CRATES --all-targets --locked --target wasm32-unknown-unknown -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo test --workspace --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wasm-bindgen-test-runner
        run: cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
      - name: Build every pure crate for wasm32-unknown-unknown (never WASI)
        run: cargo check $PURE_CRATES --locked --target wasm32-unknown-unknown
      - name: Run the pure crates' tests on wasm32 (node)
        run: cargo test $PURE_CRATES --locked --target wasm32-unknown-unknown
      - name: The site's view core on wasm32 (golden layout, round trip)
        run: |
          cargo clippy -p sw-view-wasm --all-targets --locked --target wasm32-unknown-unknown -- -D warnings
          cargo test -p sw-view-wasm --locked --target wasm32-unknown-unknown
      - name: Build the node, its store and the Worker for wasm32-unknown-unknown
        env:
          # getrandom's browser backend; RUSTFLAGS replaces .cargo/config.toml's rustflags.
          RUSTFLAGS: -D warnings --cfg getrandom_backend="wasm_js"
        run: |
          cargo check -p sw-node -p sw-store-do -p sw-worker --locked --target wasm32-unknown-unknown
          cargo clippy -p sw-node -p sw-store-do -p sw-worker --locked --target wasm32-unknown-unknown -- -D warnings

  worker:
    runs-on: ubuntu-latest
    env:
      WORKER_BUILD_VERSION: 0.8.7
      CI: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: cargo install --locked worker-build --version "$WORKER_BUILD_VERSION"
      - run: cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
      # The site (lane S3) is the Worker's [assets]: it must exist before the dry run.
      - run: npm ci --prefix site
      # The icons, favicon.ico, og-image and manifest are derived from site/public/logo.svg and
      # site/brand/brand.json; a hand edit, or an input edited without regenerating, fails here.
      - name: brand (the derived identity files match what site/scripts/brand.mjs writes)
        run: npm run brand:check --prefix site
      - name: Build the site (wasm view core, typecheck, vite)
        env:
          # Versions the service worker's cache (site/vite/service-worker.mjs).
          SITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build --prefix site
      - name: site-size (the built site's gzip is within budget.toml)
        run: cargo run --locked -p xtask -- site-size site/dist
      - name: wrangler deploy --dry-run (builds the bundle; uploads nothing, no credentials)
        # The wasm build alone takes getrandom's browser backend; a job-wide RUSTFLAGS would
        # also reach the native `cargo install` above and break getrandom there.
        env:
          RUSTFLAGS: -D warnings --cfg getrandom_backend="wasm_js"
        run: npx wrangler deploy --dry-run --outdir target/bundle
      - name: size (the bundle's gzip is within budget.toml)
        run: cargo run --locked -p xtask -- size target/bundle
      - run: npx --prefix site playwright install --with-deps chromium
      - name: Playwright against wrangler dev (the real Worker and site; unprovisioned node)
        env:
          RUSTFLAGS: -D warnings --cfg getrandom_backend="wasm_js"
        run: npm run test:e2e --prefix site
      # Two daemons and a stranger against the real Worker: create a project, invite, spend the
      # invite, admit, exchange a note and an ack; a spent invite and a refused person get nothing.
      - name: Onboarding end to end against wrangler dev (provisioned with the KAT issuer)
        run: tools/onboard-e2e.sh

  # sw-mcp natively on Windows (MSVC): the named pipe, the owner-only ACLs, the daemon end to end.
  # OpenSSL is vendored as the release builds it (PowerShell's PATH finds Strawberry Perl).
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - name: clippy (sw-mcp, sw-winacl) on x86_64-pc-windows-msvc
        run: cargo clippy -p sw-mcp -p sw-winacl --all-targets --locked --features sw-mcp/vendored-openssl -- -D warnings
      - name: test sw-mcp and sw-winacl (pipe, ACLs, daemon round trip, in-process e2e)
        run: cargo test -p sw-mcp -p sw-winacl --locked --features sw-mcp/vendored-openssl
      # A real second account: the owner-only pipe refuses it, the same pipe open to Everyone
      # admits it (tests/other_user.rs). The account and its random password live for this job.
      - name: another local user cannot open the owner-only pipe
        run: |
          $pw = "Sw-" + [guid]::NewGuid().ToString("N") + "!a1"
          Write-Output "::add-mask::$pw"
          New-LocalUser -Name sw-other -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
          $env:SW_WINACL_OTHER_USER = "sw-other"
          $env:SW_WINACL_OTHER_PASSWORD = $pw
          cargo test -p sw-winacl --test other_user --locked -- --ignored

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - name: file-length (every source file <= 250 lines)
        run: cargo run --locked -p xtask -- file-length
      - name: sbio (no I/O or OS-randomness dependency in a pure crate)
        run: cargo run --locked -p xtask -- sbio
      # The parent repo holding the contract is private, so CI proves the mirror against
      # fixtures/contract.pin (parent revision + SHA3-256 per file) instead of a checkout.
      - name: conformance (fixtures pass the shared check; mirror matches contract.pin)
        run: cargo run --locked -p xtask -- conformance
      - name: plan (wrangler.toml declares the Paid features; deploy.yml never runs on a PR)
        run: cargo run --locked -p xtask -- plan

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
