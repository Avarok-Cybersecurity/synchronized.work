[package]
name = "sw-mcp"
description = "ADAPTER. The synchronized.work MCP: a native Citadel Device client of the sw node (daemon), the MCP stdio server for coding agents (serve), the Claude Code hook, the local verification gate, and the trusted-controller allowlist (trust, revoke)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Git dependencies (the pinned SDK and identity crate): a binary for machines, not a crates.io
# library.
publish = false

[features]
# OpenSSL (which the SDK's citadel_wire links) built from source and linked statically, so a
# released binary runs on a machine without the build host's OpenSSL. The release workflow
# builds with it; a local build links the system's.
vendored-openssl = ["dep:openssl"]

[[bin]]
name = "sw-mcp"
path = "src/main.rs"

[dependencies]
sw-model.workspace = true
sw-protocol.workspace = true
sw-crypto.workspace = true
sw-client.workspace = true
ciborium.workspace = true
data-encoding.workspace = true
serde_json.workspace = true
citadel_sdk = { workspace = true, features = ["std", "filesystem"] }
citadel_user.workspace = true
citadel-identity.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "fs", "signal"] }
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
toml.workspace = true
clap.workspace = true
reqwest.workspace = true
getrandom.workspace = true
futures.workspace = true
zeroize.workspace = true
log.workspace = true
openssl = { version = "0.10.82", features = ["vendored"], optional = true }

# Windows: the named pipe's and the state directory's owner-only ACLs (the 0600/0700 of Unix).
[target.'cfg(windows)'.dependencies]
sw-winacl.workspace = true

[dev-dependencies]
sw-testkit.workspace = true
# The end-to-end scratchpad test runs the production node in-process.
sw-node.workspace = true
async-trait.workspace = true
# The wake-path test drives the shipped binary as Claude Code and Monitor would.
tokio = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dev-dependencies]
# tests/windows_owner_only.rs checks the pipe and the key files with the production rule.
sw-winacl.workspace = true

[lints]
workspace = true
