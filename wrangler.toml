SW_CITADEL_WSS = "wss://synchronized.work/citadel"
# Server-side Argon2 for legacy accounts, sized for a 128 MB isolate metered per event.
ARGON_LANES = "1"
ARGON_MEM_KIB = "4096"
ARGON_TIME_COST = "1"
# The Argon2id cost clients stretch a PQ password factor with: the SDK's floor (OWASP).
PQ_KSF_MEM_KIB = "19456"
PQ_KSF_ITERATIONS = "2"
PQ_KSF_LANES = "1"
STUN_SERVERS = "stun.cloudflare.com:3478,stun1.l.google.com:19302,stun4.l.google.com:19302"
SW_PATH_POLICY = '{"rules":[{"kind":"Direct","enabled":true,"attempt_timeout":{"secs":10,"nanos":0},"cost_weight":1,"classes":15},{"kind":"PeerRelay","enabled":true,"attempt_timeout":{"secs":10,"nanos":0},"cost_weight":2,"classes":15},{"kind":"Turn","enabled":true,"attempt_timeout":{"secs":10,"nanos":0},"cost_weight":3,"classes":15},{"kind":"ServerRelay","enabled":true,"attempt_timeout":{"secs":10,"nanos":0},"cost_weight":4,"classes":15}],"denied":0}'
# D4: a Person the node first meets approves prompts by hand, 10 signals a minute.
SW_PERSON_APPROVAL = "manual"
SW_PERSON_RATE_PER_MIN = "10"
# Design §2.6 and §4.5 caps, each a refusal.
SW_INBOX_MAX_SIGNALS = "1000"
SW_INBOX_MAX_BYTES = "4194304"
SW_MAX_PERSONS = "200"
SW_MAX_TASKS = "5000"
# The SDK's server limits. Before sign-in: 16 connections per address (a NAT's clients share
# one), 256 in all. Legacy registrations (the server hashing a password) are refused: clients
# register post-quantum. Queued outbound bytes: the inbox's 4 MiB per stream, 32 MiB in all,
# a quarter of the 128 MB isolate.
SW_PROVISIONAL_PER_IP = "16"
SW_PROVISIONAL_TOTAL = "256"
SW_LEGACY_REGISTRATION_HASHES = "refused"
SW_OUTBOUND_QUEUED_PER_STREAM = "4194304"
SW_OUTBOUND_QUEUED_TOTAL = "33554432"
LOG_LEVEL = "warn"
