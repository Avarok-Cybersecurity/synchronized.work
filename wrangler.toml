# synchronized.work: one Worker and its one ServerDO (design rev 3 §3), on the Workers Paid
# plan (D11). `tools/xtask plan` checks this file: the Paid features the design relies on
# (`limits.cpu_ms`, SQLite-backed Durable Objects) must be declared and the ones it forbids
# (queues, logpush, KV-backed object classes) must not be.
#
# Deployed only by .github/workflows/deploy.yml on a push to main; never from a PR.
name = "synchronized-work"
main = "crates/sw-worker/build/worker/shim.mjs"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

# A custom domain, not a zone route: a zone route only matches traffic that already reaches
# Cloudflare, and the apex had no DNS record, so the first deploy answered nothing. A custom
# domain makes Cloudflare create and own the apex's DNS record and certificate.
routes = [
  { pattern = "synchronized.work", custom_domain = true },
]

# workers-rs: cargo + wasm-bindgen + the generated JS shim, at the version Cargo.lock pins.
[build]
command = "cd crates/sw-worker && worker-build --release"

# The site (lane S3): `site/` built by `npm run build` into site/dist. Every request runs the
# Worker first, so pages and assets carry the Worker's security headers (CSP and the rest,
# crates/sw-worker/src/security.rs). A miss reaches the Worker (`not_found_handling = "none"`),
# which serves the app shell for an app route and 404 for a path that names a file
# (crates/sw-worker/src/fallback.rs): the binding's own SPA mode answered /og-image.png and
# /favicon.ico with the shell, 200 text/html.
[assets]
directory = "site/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

# CPU per event, in ms. A sign-in on the node is server-side OPRF + ML-KEM + the isolate's
# Argon2 cost for legacy accounts; the measured figures and their headroom are in
# tools/xtask/budget.toml, which the node-budget gate compares against.
[limits]
cpu_ms = 30000

[[durable_objects.bindings]]
name = "SERVER"
class_name = "ServerDo"

# Append-only: a deployed tag is never edited or removed. SQLite-backed, because lattice-db's
# storage contract needs per-value sizes a KV-backed object does not allow, and the SDK's
# accounts live in the object's SQL tables.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ServerDo"]

# Provisioning (sw-node `provision`): every value is required and none has a default in code.
# Secrets, set by the operator with `wrangler secret put`, never here:
#   SW_SERVER_KEY_SEED       32 bytes as 64 hex, from the OS CSPRNG: the node's identity key
#   SW_OPRF_SEED             32 bytes as 64 hex: post-quantum sign-in's OPRF seed
# and two public values, set in [vars] below:
#   SW_SERVER_KEY_ISSUED_AT  Unix seconds the key was issued (changed only with the key)
#   SW_SIGN_IN_ISSUER_PK     work.avarok.net's pinned server key (base64url ML-DSA-65), read
#                            from its /.well-known/citadel once it is served
# Until all four are set the node refuses to start: every upgrade is answered 503.
[vars]
SW_FORMER_DOMAINS = "-"
# Unix seconds at which SW_SERVER_KEY_SEED was generated (2026-11-19, by the operator); it
# changes only with that secret. A string, as every var here: the node parses it as u64.
SW_SERVER_KEY_ISSUED_AT = "1795114251"
# work.avarok.net's server key: the `server_key.pk` of https://work.avarok.net/.well-known/citadel
# (issued_at 1794930356), whose self-signature was checked with citadel-identity's
# parse_well_known before pinning. It is the only issuer of ENROL sign-in assertions.
