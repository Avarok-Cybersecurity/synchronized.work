[workspace]
resolver = "3"
members = [
    "crates/sw-model",
    "crates/sw-protocol",
    "crates/sw-crypto",
    "crates/sw-client",
    "crates/sw-graph",
    "crates/sw-testkit",
    "crates/sw-mcp",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Avarok-Cybersecurity/synchronized.work"

# One version per crypto/codec dependency (SSOT). The RustCrypto PQ crates are the ones
# citadel-app-signature and citadel-release-signature already use; every one of them is
# no_std-capable and draws no randomness unless asked, so the pure crates stay
# wasm32-unknown-unknown clean without getrandom.
[workspace.dependencies]
sw-model = { path = "crates/sw-model", version = "0.1.0" }
sw-protocol = { path = "crates/sw-protocol", version = "0.1.0" }
sw-crypto = { path = "crates/sw-crypto", version = "0.1.0" }
sw-client = { path = "crates/sw-client", version = "0.1.0" }
sw-graph = { path = "crates/sw-graph", version = "0.1.0" }
sw-testkit = { path = "crates/sw-testkit", version = "0.1.0" }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }
ml-kem = { version = "0.3.2", default-features = false, features = ["alloc", "zeroize", "hazmat"] }
sha3 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
hkdf = { version = "0.13", default-features = false }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
ciborium = { version = "0.2.2", default-features = false, features = ["std"] }
unicode-normalization = { version = "0.1.25", default-features = false }
zeroize = { version = "1.8", default-features = false }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
data-encoding = { version = "2.10", default-features = false, features = ["alloc"] }
# Exact pins: the wasm test runner (`wasm-bindgen-test-runner`, installed in CI at the same
# version) refuses a crate built against any other wasm-bindgen.
wasm-bindgen-test = "=0.3.79"
wasm-bindgen = "=0.2.129"

# Adapter-only dependencies (sw-mcp; never a pure crate's, which the sbio gate enforces). The
# Citadel SDK is pinned once, at the rev the parent workspace and the tenant Worker use (design
# §10). The identity crate is lane I1's `citadel-identity`, pinned to the citadel-internal-service
# commit that carries the sign-in proof and assertion (sign-in-with-citadel.md §1a, §6).
citadel_sdk = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", rev = "38fd3ddb" }
# The account store's credential rules (the username cap is set by the node that builds it).
citadel_user = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", rev = "38fd3ddb", default-features = false }
citadel-identity = { git = "https://github.com/Avarok-Cybersecurity/citadel-internal-service", rev = "5b2374e" }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "fs", "signal"] }
rmcp = { version = "0.16", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
getrandom = "0.3"
futures = "0.3"
log = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
