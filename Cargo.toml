[workspace]
resolver = "3"
members = [
    "crates/sw-model",
    "crates/sw-protocol",
    "crates/sw-crypto",
    "crates/sw-client",
    "crates/sw-graph",
    "crates/sw-testkit",
    "crates/sw-mcp",
    "crates/sw-winacl",
    "crates/sw-node",
    "crates/sw-store-do",
    "crates/sw-worker",
    "crates/sw-view",
    "crates/sw-view-wasm",
    "crates/sw-app-core",
    "tools/xtask",
    "tools/sw-bench",
    "tools/sw-release-sign",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Avarok-Cybersecurity/synchronized.work"

# One version per crypto/codec dependency (SSOT). The RustCrypto PQ crates are the ones
# citadel-app-signature and citadel-release-signature already use; every one of them is
# no_std-capable and draws no randomness unless asked, so the pure crates stay
# wasm32-unknown-unknown clean without getrandom.
[workspace.dependencies]
sw-model = { path = "crates/sw-model", version = "0.2.0" }
sw-protocol = { path = "crates/sw-protocol", version = "0.2.0" }
sw-crypto = { path = "crates/sw-crypto", version = "0.2.0" }
sw-client = { path = "crates/sw-client", version = "0.2.0" }
sw-graph = { path = "crates/sw-graph", version = "0.2.0" }
sw-view = { path = "crates/sw-view", version = "0.2.0" }
sw-testkit = { path = "crates/sw-testkit", version = "0.2.0" }
sw-node = { path = "crates/sw-node", version = "0.2.0" }
sw-store-do = { path = "crates/sw-store-do", version = "0.2.0" }
sw-winacl = { path = "crates/sw-winacl", version = "0.2.0" }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }
ml-kem = { version = "0.3.2", default-features = false, features = ["alloc", "zeroize", "hazmat"] }
sha3 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
hkdf = { version = "0.13", default-features = false }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
ciborium = { version = "0.2.2", default-features = false, features = ["std"] }
unicode-normalization = { version = "0.1.25", default-features = false }
zeroize = { version = "1.8", default-features = false }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
data-encoding = { version = "2.10", default-features = false, features = ["alloc"] }
# Exact pins: the wasm test runner (`wasm-bindgen-test-runner`, installed in CI at the same
# version) refuses a crate built against any other wasm-bindgen.
wasm-bindgen-test = "=0.3.79"
wasm-bindgen = "=0.2.129"

# The Citadel SDK at master (2026-11-21: required ServerLimits, CertVerification, ML-KEM-1024), without default features
# so the wasm32 build carries no filesystem backend; native builds add `std`.
citadel_sdk = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", rev = "ddae84679552c7b1f3175f53c7aeb98a4726a1c0", default-features = false }
citadel_io = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", rev = "ddae84679552c7b1f3175f53c7aeb98a4726a1c0", default-features = false }
citadel_user = { git = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol", rev = "ddae84679552c7b1f3175f53c7aeb98a4726a1c0", default-features = false }
# The portable identity (lane I1, frozen identity-api contract): the IdentityPort adapter and the
# server key behind /.well-known/citadel. Pinned to the published batch-1116 commit.
citadel-identity = { git = "https://github.com/Avarok-Cybersecurity/citadel-internal-service", rev = "5b2374ec9958a31f7b4e2a45b37ca454e14911db" }
# lattice-db main at 88b9084a (v0.5.0, untagged): the storage trait, the wasm DurableEngine and
# the exported LatticeStorage conformance suite.
latticedb-core = { git = "https://github.com/Avarok-Cybersecurity/lattice-db", rev = "88b9084a3ae45aa1c44617ffc605d2082c111b8e" }
latticedb-test-harness = { git = "https://github.com/Avarok-Cybersecurity/lattice-db", rev = "88b9084a3ae45aa1c44617ffc605d2082c111b8e" }
async-trait = "0.1"
log = "0.4"
# workers-rs at the last release built against the pinned wasm-bindgen (0.9 needs 0.2.130).
worker = "=0.8.7"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Adapter-only dependencies of sw-mcp (never a pure crate's, which the sbio gate enforces). It
# takes the SDK above with `std` and `filesystem`, and tokio with the runtime features it needs.
rmcp = { version = "0.16", features = ["server", "transport-io"] }
schemars = "1"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

# The Worker keeps its custom sections: wasm-bindgen reads `target_features` to see that the
# module uses reference types (the externref table worker-build's abort handler needs), and a
# fully stripped module has none. Debug info is still dropped.
[profile.release.package.sw-worker]
strip = "debuginfo"
