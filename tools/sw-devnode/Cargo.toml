[package]
name = "sw-devnode"
description = "A test-only synchronized.work node on loopback for another repository's CI: the production sw-node kernel, natively, in memory, provisioned from wrangler.toml with published test seeds; and signed-in sw-mcp homes for it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sw-node.workspace = true
sw-mcp.workspace = true
sw-model.workspace = true
sw-protocol.workspace = true
citadel-identity.workspace = true
citadel_sdk = { workspace = true, features = ["std", "filesystem", "localhost-testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
async-trait.workspace = true
data-encoding.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true
