[package]
name = "sw-bench"
description = "Measures the node under wrangler dev (design §11.1 node-budget): CPU per sign-in and per message, and workerd memory at N sessions, driven by real native Citadel clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sw-protocol.workspace = true
sw-crypto.workspace = true
sw-model.workspace = true
citadel-identity.workspace = true
citadel_sdk = { workspace = true, features = ["std", "filesystem"] }
citadel_io = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
futures.workspace = true
data-encoding.workspace = true
serde_json.workspace = true

[lints]
workspace = true
